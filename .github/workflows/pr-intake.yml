name: "PR: Intake"

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview eligible pull requests without adding labels or comments
        required: true
        type: boolean
        default: true

env:
  INTAKE_LABEL: Triage
  INTAKE_COMMENT: |
    ## Pull request received

    Thanks for contributing. Please review the [contribution guidelines](https://github.com/${{ github.repository }}/blob/dev/CONTRIBUTING.md) while your pull request is triaged.

    Maintainers review pull requests as time allows and may take them in any order. Large or poorly scoped pull requests may take significantly longer to review or be declined.

    Keep drafts local until they are actively being prepared for review. Open a pull request only when you intend to carry it through to a merge decision.

jobs:
  label:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [process.env.INTAKE_LABEL],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.INTAKE_COMMENT,
            });

  backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const dryRun = process.env.DRY_RUN === 'true';
            let eligiblePullRequests = 0;

            for (let page = 1; ; page += 1) {
              const { data: pullRequests } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
                page,
              });

              for (const pullRequest of pullRequests) {
                if (pullRequest.labels.length !== 0) continue;
                eligiblePullRequests += 1;

                if (dryRun) {
                  core.notice(`#${pullRequest.number}: ${pullRequest.title}`);
                  continue;
                }

                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  labels: [process.env.INTAKE_LABEL],
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body: process.env.INTAKE_COMMENT,
                });
              }

              if (pullRequests.length < 100) break;
            }

            core.notice(
              `${dryRun ? 'Dry run found' : 'Processed'} ${eligiblePullRequests} eligible pull request(s).`,
            );
