name: "PR: Intake"

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview eligible pull requests without adding labels or comments
        required: true
        type: boolean
        default: true

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: Dispatcharr/repo-bot/actions/pr-intake@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ inputs.dry_run || 'false' }}
          intake-comment: |
            ## Pull request received

            Thanks for contributing. Please review the [contribution guidelines](https://github.com/${{ github.repository }}/blob/dev/CONTRIBUTING.md) while your pull request is triaged.

            Maintainers review pull requests as time allows and may take them in any order. Large or poorly scoped pull requests may take significantly longer to review or be declined.

            Keep drafts local until they are actively being prepared for review. Open a pull request only when you intend to carry it through to a merge decision.
