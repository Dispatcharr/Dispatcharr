services:
  dispatcharr:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/dispatcharr/dispatcharr:latest
    restart: unless-stopped
    container_name: dispatcharr
    ports:
      - 9191:9191
    volumes:
      - dispatcharr_data:/data
    environment:
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      # Redis idle-client timeout in seconds, and per-process redis-py /
      # django-redis pool cap (Optional, defaults: 300 / 50)
      #- REDIS_IDLE_TIMEOUT=300
      #- REDIS_MAX_CONNECTIONS=50
      # First-time web setup from a public IP (optional). When unset, only
      # local/private networks may POST to initialize-superuser.
      #- DISPATCHARR_SETUP_ALLOWED_IP=203.0.113.50

      # Outer reverse proxy trust (optional). When unset, private/loopback peers
      # may set X-Real-IP / X-Forwarded-For (typical Docker/Traefik setups).
      # Set to a specific IP/CIDR to narrow trust, or none to ignore proxy headers.
      #- DISPATCHARR_TRUSTED_PROXIES=172.18.0.0/16
      #- DISPATCHARR_TRUSTED_PROXIES=none

      # Legacy CPU Support (Optional)
      # Uncomment to enable legacy NumPy build for older CPUs (circa 2009)
      # that lack support for newer baseline CPU features
      #- USE_LEGACY_NUMPY=true
      # Process Priority Configuration (Optional)
      # Lower values = higher priority. Range: -20 (highest) to 19 (lowest)
      # Negative values require cap_add: SYS_NICE (uncomment below)
      #- UWSGI_NICE_LEVEL=-5   # uWSGI/FFmpeg/Streaming (default: 0, recommended: -5 for high priority)
      #- CELERY_NICE_LEVEL=5   # Celery/EPG/Background tasks (default: 5, low priority)

      # Soft open-file limit for uwsgi/daphne/celery (Optional, default: 65536)
      #- DISPATCHARR_NOFILE=65536
    #
    # Uncomment to enable high priority for streaming (required if UWSGI_NICE_LEVEL < 0)
    #cap_add:
    #  - SYS_NICE
    # Optional for hardware acceleration
    #devices:
    #  - /dev/dri:/dev/dri  # For Intel/AMD GPU acceleration (VA-API)
    # Uncomment the following lines for NVIDIA GPU support
    # NVidia GPU support (requires NVIDIA Container Toolkit)
    #deploy:
    #  resources:
    #      reservations:
    #          devices:
    #              - driver: nvidia
    #                count: all
    #                capabilities: [gpu]

volumes:
  dispatcharr_data:
