# Diagnostics only, and the collector normalizes them: the access log stays off
# stdout because uwsgi already logs a line per request.
error_log /dev/stderr;

# Channel/VOD logos and SD program posters share /data/cache/ with separate zones.
proxy_cache_path /data/cache/logos levels=1:2 keys_zone=logo_cache:10m
                 inactive=24h use_temp_path=off;

proxy_cache_path /data/cache/sd_posters levels=1:2 keys_zone=sd_poster_cache:10m
                 inactive=14d use_temp_path=off;

# SD poster cache key: the artwork hash (?v=), not the program id. A refresh
# deletes and reinserts programs, so ids change while the artwork (and v) stays
# the same, and many programs share one image.
#
# Only the exact query v=<12 lowercase hex>, which is what Django emits, shares
# a key. nginx and Django read query strings differently ($arg_v takes the
# first duplicate and matches the name case-insensitively; Django takes the
# last and is case-sensitive), so any other shape (v=a&v=b, V=a) gets a per-URL
# key. That keeps the view's check that v matches the program's artwork valid
# for every shared key.
map $args $sd_poster_cache_key {
    "~^v=(?<sd_poster_v>[0-9a-f]{12})$"  $sd_poster_v;
    default                               $scheme$uri$is_args$args;
}

server {
    listen NGINX_PORT;
    listen [::]:NGINX_PORT;

    proxy_connect_timeout 75;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    client_max_body_size 0;
    # Redirect stream profiles return the provider URL in a Location header.
    # The response headers must fit in uwsgi_buffer_size or nginx answers 502
    # (upstream sent too big header). The default is one memory page (4k on
    # most hosts), too small for URLs near Stream.url's 8192-character max.
    # 16k fits that Location plus the other headers. uwsgi_busy_buffers_size is
    # set explicitly because its derived default (2 x buffer_size) fails nginx -t
    # against the default body buffers on 4k-page hosts.
    uwsgi_buffer_size 16k;
    uwsgi_busy_buffers_size 16k;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Serve Django via uWSGI
    location / {
        include uwsgi_params;
        uwsgi_pass unix:/app/uwsgi.sock;
    }

    location /assets/ {
        root /app/static;
    }

    location /static/ {
        root /app;
    }

    location /logos/ {
        root /data;
    }

    # Internal location for X-Accel-Redirect backup downloads
    # Django handles auth, nginx serves the file directly
    location /protected-backups/ {
        internal;
        alias /data/backups/;
    }

    # Optional trailing slash: some clients strip it from artwork URLs.
    # Internal rewrite keeps one proxy_cache key ($uri) for both spellings;
    # Django also accepts slash-less paths for non-nginx deployments.
    location ~ ^/api/channels/logos/(?<logo_id>\d+)/cache/?$ {
        rewrite ^(/api/channels/logos/\d+/cache)$ $1/ break;
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$uri$is_args$args";  # Cache per logo URL
        proxy_cache_valid 200 24h;  # Cache successful logos for 24 hours
        proxy_cache_valid 404 1m;   # Short negative cache; avoids stampeding Django/upstream
        proxy_cache_use_stale error timeout updating;  # Serve stale if Django is slow
    }

    location ~ ^/api/vod/vodlogos/(?<logo_id>\d+)/cache/?$ {
        rewrite ^(/api/vod/vodlogos/\d+/cache)$ $1/ break;
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$uri$is_args$args";  # Cache per logo URL
        proxy_cache_valid 200 24h;  # Cache successful logos for 24 hours
        proxy_cache_valid 404 1m;   # Short negative cache; avoids stampeding Django/upstream
        proxy_cache_use_stale error timeout updating;  # Serve stale if Django is slow
    }

    # Parent-scoped VOD images (backdrops, episode stills, etc.)
    location ~ ^/api/vod/(movies|series|episodes)/(?<vod_id>\d+)/image/?$ {
        rewrite ^(/api/vod/(?:movies|series|episodes)/\d+/image)$ $1/ break;
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$uri$is_args$args";
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
    }

    # SD program posters: 14d nginx cache under $sd_poster_cache_key (see the
    # map above).
    # The view sends Cache-Control max-age=86400 for browsers, plus Vary
    # headers. Left alone, nginx would use that max-age instead of
    # proxy_cache_valid and keep one entry per Accept value. The image bytes do
    # not depend on either, so both are ignored here.
    # proxy_cache_lock collapses parallel misses for one artwork into a single
    # upstream fetch (guide clients request every program at once). Its timeout
    # and age must outlast the slowest fetch (SD token plus image, about 25s);
    # the 5s defaults would release more requests to SD.
    # Do not add proxy_cache_valid 404 here. Bare HTTP 404s from SD/CDN are treated
    # as transient in the poster proxy (only code 5000 blacklists); a negative cache
    # would delay legitimate retries. Permanent misses are handled in Django/DB.
    location ~ ^/api/epg/programs/(?<prog_id>\d+)/poster/?$ {
        rewrite ^(/api/epg/programs/\d+/poster)$ $1/ break;
        proxy_pass http://127.0.0.1:5656;
        proxy_cache sd_poster_cache;
        proxy_cache_key "$sd_poster_cache_key";
        proxy_cache_valid 200 14d;
        proxy_ignore_headers Cache-Control Expires Vary;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_use_stale error timeout updating;
    }

    # Admin UI disabled outside dedicated admin access. Match /admin and all
    # deeper Django admin paths (e.g. /admin/login/), but do not match the
    # three-segment XC stream form /admin/<password>/<channel_id> used when
    # the XC username is literally "admin".
    location ~ ^/admin(?!/[^/]+/[^/]+/?$)(?:/|$) {
        return 301 /login;
    }

    # Route HDHR request to Django
    location /hdhr {
        include uwsgi_params;
        uwsgi_pass unix:/app/uwsgi.sock;
    }

    # WebSockets for real-time communication
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Route TS proxy requests to the dedicated instance
    location /proxy/ {
        include uwsgi_params;
        uwsgi_pass unix:/app/uwsgi.sock;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
    }
}
